[package]
name = "sapu-gui"
version.workspace = true
edition.workspace = true
description = "Sapu Jagat - desktop GUI (Tauri, HTML/CSS/JS front-end)"

[[bin]]
name = "sapu-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sapu-core = { path = "../core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
# required so release builds load the embedded UI instead of a dev server
custom-protocol = ["tauri/custom-protocol"]
