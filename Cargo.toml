[workspace]
resolver = "2"
members = ["core", "cli", "gui"]

# Single source of truth for the release version.
# Members inherit it; gui/tauri.conf.json omits "version" so the
# installer and app version come from here too.
[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
strip = true
